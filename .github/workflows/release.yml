# Builds Deskbridge and publishes it as a GitHub release whenever the VERSION
# file changes on one of the release branches. Installed copies find the
# release, check its signature, and offer it through the client's Update
# button.
#
# There are three release channels, each published from its own branch:
#   main   Mainline   VERSION like 1.10.0           a normal release
#   beta   Beta       VERSION like 1.11.0-beta.1    a pre-release
#   alpha  Alpha      VERSION like 1.11.0-alpha.1   a pre-release
# A client follows Mainline unless told otherwise (More > Releases), and
# GitHub's "latest release" only ever names a Mainline version, so Beta and
# Alpha versions reach nobody who has not asked for them. The version must
# suit the branch, or nothing is published: that stops a merge between
# branches from publishing a test version as a finished one.
#
# Needs one repository secret, UPDATE_SIGNING_KEY: the private half of the
# key whose public half is in internal/update/key.go.
# (Settings > Secrets and variables > Actions > New repository secret.)
name: Release

on:
  push:
    branches: [main, beta, alpha]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write
  packages: write # the relay's container image

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Read version
        id: version
        run: echo "version=$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Check the version suits this branch
        run: |
          V="${{ steps.version.outputs.version }}"
          case "$GITHUB_REF_NAME" in
            main)  WANT='^[0-9]+\.[0-9]+\.[0-9]+$' ;;
            beta)  WANT='^[0-9]+\.[0-9]+\.[0-9]+-beta\.[1-9][0-9]*$' ;;
            alpha) WANT='^[0-9]+\.[0-9]+\.[0-9]+-alpha\.[1-9][0-9]*$' ;;
            *) echo "::error::Releases are only published from the main, beta and alpha branches, not from $GITHUB_REF_NAME."; exit 1 ;;
          esac
          if ! printf '%s' "$V" | grep -Eq "$WANT"; then
            echo "::error::Version $V does not suit the $GITHUB_REF_NAME branch. main takes 1.2.3, beta takes 1.2.3-beta.1, alpha takes 1.2.3-alpha.1."
            exit 1
          fi

      - name: Stop if this version is already published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Version ${{ steps.version.outputs.version }} is already published. Change the VERSION file to publish a new one."
            exit 1
          fi

      - name: Test
        run: go test ./internal/...

      - name: Build
        run: ./build.sh

      - name: Sign
        env:
          DESKBRIDGE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: go run ./tools/sign -version "${{ steps.version.outputs.version }}" "dist/Deskbridge-Setup-${{ steps.version.outputs.version }}.exe"

      # The relay as a container image, for whoever hosts one (see README:
      # INTERNET). Tagged with the version, and with the channel's name
      # ("alpha", "beta", or "latest" for Mainline).
      - name: Publish the relay image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/deskbridge-relay"
          CHANNEL="$GITHUB_REF_NAME"
          if [ "$CHANNEL" = main ]; then CHANNEL=latest; fi
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build -t "$IMAGE:$V" -t "$IMAGE:$CHANNEL" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.description=Deskbridge relay $V" .
          docker push "$IMAGE:$V"
          docker push "$IMAGE:$CHANNEL"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          if [ "$GITHUB_REF_NAME" = main ]; then
            KIND="--latest"
            NOTES="Run Deskbridge-Setup-$V.exe on each PC, or click Update in the Deskbridge client. The .sig file is the signature installed copies check before updating."
          else
            KIND="--prerelease --latest=false"
            NOTES="A test version from the $GITHUB_REF_NAME branch. It is offered only to clients set to follow it (More > Releases). The .sig file is the signature installed copies check before updating."
          fi
          gh release create "v$V" \
            "dist/Deskbridge-Setup-$V.exe" \
            "dist/Deskbridge-Setup-$V.exe.sig" \
            --target "$GITHUB_SHA" \
            --title "Deskbridge $V" \
            --notes "$NOTES" \
            $KIND
